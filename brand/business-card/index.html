  :root {
    --ink: #17130F;
    --cream: #FFF7EA;
    --flip: #F26A1B;
    --flip-deep: #C9500E;
    --muted: #6E6154;
    --line: #EADCC6;
    --ground: #F3E6D0;
    --card-shadow: 0 1px 0 #fff inset, 0 20px 40px -18px rgba(80, 45, 10, .35);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ground: #1B1510; --card-shadow: 0 20px 50px -20px rgba(0,0,0,.8); color-scheme: dark; }
  }
  :root[data-theme="dark"] { --ground: #1B1510; --card-shadow: 0 20px 50px -20px rgba(0,0,0,.8); color-scheme: dark; }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 500 16px/1.45 "Nunito", ui-rounded, system-ui, -apple-system, sans-serif;
    padding-inline: 16px; padding-block: 24px 40px;
    -webkit-text-size-adjust: 100%;
  }
  .card {
    max-width: 400px; margin: 0 auto; background: var(--cream);
    border-radius: 28px; box-shadow: var(--card-shadow);
    padding: 28px 24px 24px; display: grid; gap: 22px;
  }
  .brand { display: grid; justify-items: center; gap: 2px; text-align: center; }
  .brand svg { width: 78%; max-width: 280px; height: auto; }
  .word { font: 400 clamp(2.6rem, 13vw, 3.3rem)/.95 "Titan One", "Arial Rounded MT Bold", system-ui, sans-serif; letter-spacing: .01em; margin: 6px 0 0; }
  .word span { color: var(--flip); }
  .sub { font-weight: 900; letter-spacing: .42em; font-size: .95rem; margin-right: -.42em; }

  /* a row of playfield insert lights, one lit */
  .inserts { display: flex; justify-content: center; gap: 10px; }
  .inserts i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  .inserts i.on { background: var(--flip); box-shadow: 0 0 0 4px rgba(242,106,27,.18); }

  .who { text-align: center; }
  .who h1 { font: 900 1.6rem/1.15 "Nunito", system-ui, sans-serif; margin: 0; text-wrap: balance; }
  .who p { margin: 2px 0 0; color: var(--muted); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .78rem; }

  .rows { display: grid; gap: 10px; }
  .row {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px;
    border: 2px solid var(--line); border-radius: 18px; padding: 10px 10px 10px 14px;
  }
  .row a.val { color: var(--ink); text-decoration: none; min-width: 0; }
  .row small { display: block; color: var(--muted); font-weight: 700; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; }
  .row b { display: block; font-weight: 800; font-size: clamp(.86rem, 4vw, 1.05rem); overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; }
  .copy {
    font: 800 .8rem "Nunito", system-ui, sans-serif; color: var(--ink); background: transparent;
    border: 2px solid var(--ink); border-radius: 999px; padding: 6px 11px; cursor: pointer; font-size: .74rem;
  }
  .copy.done { background: var(--ink); color: var(--cream); }

  .save {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--flip); color: var(--ink); text-decoration: none;
    font: 900 1.1rem "Nunito", system-ui, sans-serif; border-radius: 999px; padding: 15px 20px;
    border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
    transition: transform .08s, box-shadow .08s;
  }
  .save:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .save svg { width: 22px; height: 22px; }

  .qr { display: grid; grid-template-columns: 124px 1fr; gap: 16px; align-items: center; border-top: 2px dashed var(--line); padding-top: 20px; }
  .qr svg { width: 124px; height: 124px; display: block; }
  .qr p { margin: 0; font-size: .92rem; color: var(--muted); }
  .qr strong { display: block; color: var(--ink); font-weight: 900; font-size: 1rem; }

  a:focus-visible, button:focus-visible { outline: 3px solid var(--flip); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .save { transition: none; } }
</style>

  document.querySelectorAll('.copy').forEach(function (btn) {
    btn.addEventListener('click', function () {
      function ok() { btn.textContent = 'Copied'; btn.classList.add('done'); setTimeout(function () { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1600); }

        var el = btn.parentElement.querySelector('b'); var r = document.createRange(); r.selectNodeContents(el);
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = 'Selected';

      try { navigator.clipboard.writeText(btn.dataset.copy).then(ok, fallback); } catch (e) { fallback(); }
    });
  });
